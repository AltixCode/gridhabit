name: EAS Build

# Dispatch-only. An EAS build consumes build credits and a production one can
# be promoted to a store, so it is always a deliberate action rather than a
# side effect of pushing. Lint, typecheck and tests run on every push in ci.yml.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
        required: true
      platform:
        description: Target platform
        type: choice
        options: [all, ios, android]
        default: all
        required: true
      submit:
        description: Submit to the stores after a successful build
        type: boolean
        default: false

jobs:
  build:
    name: Build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Lint, typecheck and test before burning a build
        run: |
          npm run lint
          npm run typecheck
          npm run test:ci

      - name: Write Google Play service account key
        if: ${{ inputs.submit }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON secret is not set"; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json

      - name: EAS build
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          eas build \
            --profile "${{ inputs.profile }}" \
            --platform "${{ inputs.platform }}" \
            --non-interactive \
            --no-wait

      - name: Remove service account key
        if: always()
        run: rm -f google-service-account.json
