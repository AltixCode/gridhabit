name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      # Only on failure — that is when the report is worth reading — and never
      # blocking: an artifact storage quota is not a reason to fail a green
      # test run.
      - name: Upload coverage report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov-report
          retention-days: 3
          if-no-files-found: ignore

  expo-doctor:
    name: Expo doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Validate native config and dependency versions
        run: npx expo-doctor
        env:
          # Doctor only needs the config to resolve; real IDs are not required.
          EXPO_NO_TELEMETRY: '1'
